<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Marvellous, full-stack developer from Rotterdam">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="380" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#0B0D1A"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>
  </g>

  <!-- status pill -->
  <g transform="translate(64,58)">
    <rect width="300" height="34" rx="17" fill="#1E1B4B" stroke="#4F46E5" stroke-opacity="0.6"/>
    <circle cx="20" cy="17" r="5" fill="#34D399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="22" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" fill="#C7D2FE">Open to internship · Rotterdam</text>
  </g>

  <!-- name -->
  <text x="60" y="198" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="url(#name)">Marvellous</text>
  <text x="64" y="252" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#A5B4FC">Full-stack developer<tspan fill="#818CF8" font-weight="700"> _</tspan></text>
  <text x="64" y="300" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="16" fill="#6B7280">PHP · Laravel · MySQL · JavaScript · C#</text>

  <!-- terminal window -->
  <g transform="translate(728,70)">
    <rect width="410" height="240" rx="12" fill="#11132A" stroke="#312E81"/>
    <rect width="410" height="36" rx="12" fill="#1A1C3A"/>
    <rect y="24" width="410" height="12" fill="#1A1C3A"/>
    <circle cx="22" cy="18" r="6" fill="#F87171"/>
    <circle cx="42" cy="18" r="6" fill="#FBBF24"/>
    <circle cx="62" cy="18" r="6" fill="#34D399"/>
    <text x="205" y="23" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#6B7280">~/marvellous</text>

    <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" xml:space="preserve">
      <text x="22" y="72"><tspan fill="#818CF8">$</tspan><tspan fill="#E5E7EB"> php artisan serve</tspan></text>
      <text x="22" y="98" fill="#34D399">  INFO  Server running on 127.0.0.1:8000</text>
      <text x="22" y="132"><tspan fill="#818CF8">$</tspan><tspan fill="#E5E7EB"> php artisan migrate</tspan></text>
      <text x="22" y="158" fill="#9CA3AF">  users, projects ........ <tspan fill="#34D399">DONE</tspan></text>
      <text x="22" y="192"><tspan fill="#818CF8">$</tspan><tspan fill="#E5E7EB"> git push origin main</tspan></text>
      <rect x="226" y="178" width="9" height="18" fill="#A5B4FC">
        <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
