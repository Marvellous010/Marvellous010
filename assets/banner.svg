<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Marvellous, software developer, currently intern at DIVD.works">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <radialGradient id="g1" cx="0.85" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.55"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.05" cy="1" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.28"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#E0E7FF"/><stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="ul" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/><stop offset="0.5" stop-color="#818CF8"/><stop offset="1" stop-color="#4F46E5"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="400" fill="#0B0D1A"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <rect width="1200" height="400" fill="url(#g1)"/>
    <rect width="1200" height="400" fill="url(#g2)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="20" fill="none" stroke="#262A55"/>

  <g transform="translate(64,60)">
    <rect width="318" height="34" rx="17" fill="#14123A" stroke="#4F46E5" stroke-opacity="0.7"/>
    <circle cx="20" cy="17" r="5" fill="#34D399"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="17" r="5" fill="none" stroke="#34D399"><animate attributeName="r" values="5;11" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/></circle>
    <text x="34" y="22" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" fill="#C7D2FE">Currently: Intern @ DIVD.works</text>
  </g>

