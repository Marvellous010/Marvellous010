  <rect x="64" y="226" width="250" height="4" rx="2" fill="url(#ul)"/>
  <text x="64" y="276" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#E0E7FF">Software Developer <tspan fill="#8B92B0" font-weight="400">· Rotterdam, NL</tspan></text>
  <text x="64" y="320" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="16" fill="#8B92B0">PHP · Symfony · Laravel · PostgreSQL · C#</text>

  <g transform="translate(724,64)">
    <rect width="420" height="272" rx="14" fill="#0F1128" stroke="#2E2A70"/>
    <path d="M14 0H406A14 14 0 0 1 420 14V38H0V14A14 14 0 0 1 14 0Z" fill="#171A3A"/>
    <circle cx="22" cy="19" r="6" fill="#F87171"/><circle cx="42" cy="19" r="6" fill="#FBBF24"/><circle cx="62" cy="19" r="6" fill="#34D399"/>
    <text x="210" y="24" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#8B92B0">marvellous@rotterdam: ~</text>
    <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" xml:space="preserve">
      <text x="22" y="74"><tspan fill="#818CF8">❯</tspan><tspan fill="#E5E7EB"> whoami</tspan></text>
      <text x="22" y="98" fill="#C7D2FE">  marvellous · software developer</text>
      <text x="22" y="132"><tspan fill="#818CF8">❯</tspan><tspan fill="#E5E7EB"> cat now.txt</tspan></text>
      <text x="22" y="156" fill="#C7D2FE">  intern @ <tspan fill="#34D399">DIVD.works</tspan> · Symfony</text>
      <text x="22" y="180" fill="#C7D2FE">  student @ Techniek College Rotterdam</text>
      <text x="22" y="214"><tspan fill="#818CF8">❯</tspan><tspan fill="#E5E7EB"> git push origin main</tspan></text>
      <text x="22" y="238" fill="#34D399">  ✓ shipped</text>
      <rect x="132" y="225" width="9" height="17" fill="#818CF8"><animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></rect>
    </g>
  </g>
