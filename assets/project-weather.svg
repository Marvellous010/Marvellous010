<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200" role="img" aria-label="Weather App: Search any city and get live temperature, humidity and wind speed from the OpenWeatherMap API.">
  <defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#4F46E5"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="579" height="199" rx="16" fill="#11132A" stroke="#262A55"/>
  <rect x="0" y="22" width="4" height="40" rx="2" fill="url(#a)"/>
  <circle cx="34" cy="38" r="6" fill="#F1E05A"/>
  <text x="48" y="44" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Weather App</text>
  
  <text x="546" y="45" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#818CF8">↗<animateTransform attributeName="transform" type="translate" values="0 0;3 -3;0 0" dur="2.4s" repeatCount="indefinite"/></text>
