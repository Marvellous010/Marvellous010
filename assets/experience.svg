<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 386" width="1200" height="386" role="img" aria-label="Experience: Software Development Intern at DIVD.works, building a Symfony coaching membership platform with Stripe payments, webhooks and session credits. Student Software Developer MBO 4 at Techniek College Rotterdam.">
