<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Experience: Software development intern at DIVD.works, now. Student Software Developer MBO 4 at Techniek College Rotterdam.">
  <rect width="1200" height="270" rx="20" fill="#0B0D1A"/>
  <rect x="0.5" y="0.5" width="1199" height="269" rx="20" fill="none" stroke="#262A55"/>
  <g transform="translate(24,0)">
    <line x1="40" y1="72" x2="40" y2="180" stroke="#262A55" stroke-width="3" stroke-dasharray="4 6"/>
    
    <circle cx="40" cy="72" r="9" fill="#34D399"/><circle cx="40" cy="72" r="9" fill="none" stroke="#34D399"><animate attributeName="r" values="9;16" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/></circle>
    <text x="76" y="68" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Software Development Intern</text>
    <text x="76" y="96" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#818CF8">DIVD.works · Dutch Institute for Vulnerability Disclosure</text>
    <rect x="1091" y="50" width="45" height="28" rx="14" fill="#1E1B4B"/>
    <text x="1113.5" y="69" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#C7D2FE">now</text>
    <text x="76" y="124" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#8B92B0">Working with a non-profit that makes the internet safer by finding and reporting security vulnerabilities.</text>
    
    <circle cx="40" cy="190" r="9" fill="#11132A" stroke="#818CF8" stroke-width="3"/>
    <text x="76" y="186" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Software Developer (MBO 4)</text>
    <text x="76" y="214" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#818CF8">Techniek College Rotterdam</text>
    <rect x="1060" y="168" width="76" height="28" rx="14" fill="#1E1B4B"/>
    <text x="1098.0" y="187" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" fill="#C7D2FE">student</text>
    <text x="76" y="242" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#8B92B0">Full-stack web development, databases, object-oriented programming and team projects.</text>
