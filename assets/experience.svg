    <text x="76" y="126" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#8B92B0">Building a coaching membership platform in Symfony: members pay a subscription, and the system</text><text x="76" y="148" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#8B92B0">automatically grants and blocks session credits through payment webhooks, with booking for coaches.</text><text x="76" y="170" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#8B92B0">Focus on security and reliability: idempotent webhooks, fail-closed access and automated tests.</text>
